<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由施力運動</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
        background-color: #f4f6f9;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    /* 主容器：採用 Flexbox 實現左右分欄 */
    .app-container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        max-width: 1300px;
        width: 100%;
    }

    /* 左側主運動區域 */
    .main-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #applyF {
        border: 2px solid #5f9ea0;
        border-radius: 6px;
        background-color: #A9F5BC;
        width: 100%;
        max-width: 900px;
        height: auto;
        aspect-ratio: 16 / 9;
    }

    /* 右側控製麵板區域 */
    .control-panel {
        width: 320px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        background-color: #fafafa;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }
    #control {
        border: 2px solid #888;
        border-radius: 6px;
        background-color: #819FF7;
        cursor: pointer;
    }

    /* 按鈕網格系統 */
    .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 100%;
    }
    .btn {
        font-size: 15px;
        font-weight: bold;
        color: #0B3861;
        background-color: #E0F8E6;
        border: 1px solid #b2d8d8;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn:hover {
        background-color: #c2f0d0;
    }
    .btn-danger {
        background-color: #fce4e4;
        border-color: #f7b2b2;
    }
    .btn-danger:hover {
        background-color: #f7c6c6;
    }
</style>
</head>
<body>

<div class="app-container">
    <!-- 左側運動區域 -->
    <div class="main-stage">
        <canvas id="applyF" width="900" height="506">您的瀏覽器不支援 HTML5 Canvas。</canvas>
    </div>

    <!-- 右側控製麵板 -->
    <div class="control-panel">
        <canvas id="control" width="300" height="300">您的瀏覽器不支援 HTML5 Canvas。</canvas>
        <div class="button-group">
            <button id="bStart" class="btn" onclick="spc()">開始運動</button>
            <button id="bClear" class="btn" onclick="clearT()">清除軌跡</button>
            <button id="bZeroF" class="btn" onclick="zeroF()">F ≠ 0</button>
            <button id="bBack" class="btn btn-danger" onclick="back()">停止並返回</button>
        </div>
    </div>
</div>

<script>
let then, now, delta, interval1 = 30, count = 0;
let widthF, widthFD2, heightF, heightFD2, widthC, widthCD2, heightC, heightCD2;
let myrequest = 0;
let canvasF, canvasC, caPat;
let cxtF, cxtC, cxPat;
let deltat = 0.01;
let arrowXC, arrowYC;
let ballX, ballY, velX = 60.0, velY = 0.0, mass = 2.0, forceX = 0, forceY = 0;
let yesADrag = false;
let oldMX, oldMY, oldAX, oldAY;
let showF = true;
let firstAppearance = true;

window.onload = function() {
    canvasF = document.getElementById("applyF");
    canvasC = document.getElementById("control");

    if (canvasF && canvasF.getContext) {
        cxtF = canvasF.getContext("2d");
        widthF = canvasF.width;
        widthFD2 = widthF / 2;
        heightF = canvasF.height;
        heightFD2 = heightF / 2;
        ballX = widthFD2 - 100.0;
        ballY = heightFD2 - 100.0;

        caPat = document.createElement("canvas");
        caPat.width = widthF;
        caPat.height = heightF;
        cxPat = caPat.getContext("2d");
        cxPat.fillStyle = "black";

        cxtF.font = '12pt sans-serif';
        cxtF.textAlign = "center";
        cxtF.textBaseline = "middle";
    }

    if (canvasC && canvasC.getContext) {
        cxtC = canvasC.getContext("2d");
        widthC = canvasC.width;
        widthCD2 = widthC / 2;
        heightC = canvasC.height;
        heightCD2 = heightC / 2;
        arrowXC = widthCD2 + forceX;
        arrowYC = heightCD2 - forceY;

        canvasC.addEventListener('mousedown', mouseDown, false);
        canvasC.addEventListener('mousemove', mouseMove, false);
        canvasC.addEventListener('mouseup', mouseUp, false);
        canvasC.addEventListener('mouseleave', mouseUp, false);
        canvasC.addEventListener('touchstart', touchDown, { passive: false });
        canvasC.addEventListener('touchmove', touchMove, { passive: false });
        canvasC.addEventListener('touchend', touchUp, false);
        cxtC.font = '12pt sans-serif';
    }
    paintC();
    paintF();
};

function spc() {
    const btn = document.getElementById("bStart");
    if (myrequest) {
        stop();
        btn.textContent = "繼續";
    } else {
        start();
        btn.textContent = "暫停";
    }
}

function start() {
    if (!myrequest) {
        firstAppearance = false;
        then = window.performance.now();
        myrequest = window.requestAnimationFrame(animate);
    }
}

function stop() {
    if (myrequest) {
        window.cancelAnimationFrame(myrequest);
        myrequest = 0;
    }
}

function animate(time) {
    if (canvasF && canvasF.getContext) {
        now = window.performance.now();
        myrequest = window.requestAnimationFrame(animate);
        delta = now - then;

        if (delta > interval1) {
            calculate();
            if (count >= 20) {
                trace();
                count = 0;
            }
            paintF();
            paintC();
            count++;
            then = now - (delta % interval1);
        }
    }
}

function zeroF() {
    showF = !showF;
    const btn = document.getElementById("bZeroF");
    btn.textContent = showF ? "F ≠ 0" : "F = 0";
    if (!myrequest) {
        paintF();
        paintC();
    }
}

function back() {
    stop();
    ballX = widthFD2 - 100.0;
    ballY = heightFD2 - 100.0;
    forceX = 0; forceY = 0;
    arrowXC = widthCD2 + forceX;
    arrowYC = heightCD2 - forceY;
    velX = 60.0;
    velY = 0.0;
    clearT();
    paintF();
    paintC();
    document.getElementById("bStart").textContent = "開始運動";
}

function calculate() {
    let accelX = forceX / mass;
    let accelY = forceY / mass;

    if (!showF) {
        accelX = 0.0;
        accelY = 0.0;
    }

    let deltaSquare = deltat * deltat;
    ballX += velX * deltat + 0.5 * accelX * deltaSquare;
    ballY -= velY * deltat + 0.5 * accelY * deltaSquare;
    velX += accelX * deltat;
    velY += accelY * deltat;
}

function paintF() {
    cxtF.clearRect(0, 0, widthF, heightF);
    drawGridF();
    drawBallF();
    cxtF.drawImage(caPat, 0, 0);
}

function drawBallF() {
    cxtF.beginPath();
    cxtF.fillStyle = "green";
    cxtF.arc(ballX, ballY, 12, 0, 2 * Math.PI);
    cxtF.fill();

    if (showF) {
        cxtF.beginPath();
        cxtF.fillStyle = "red";
        let arrowXF = ballX + forceX;
        let arrowYF = ballY - forceY;
        arrow(cxtF, arrowXF, arrowYF, ballX, ballY, 2);
        let netF = Math.sqrt(forceX * forceX + forceY * forceY);
        let xF = Math.round(((netF + 18.0) * arrowXF - 18.0 * ballX) / netF);
        let yF = Math.round(((netF + 18.0) * arrowYF - 18.0 * ballY) / netF);
        cxtF.fillText(firstAppearance ? "力 F" : "F", xF || ballX, yF || ballY);
    }
    cxtF.fillStyle = "blue";
    arrow(cxtF, velX + ballX, -velY + ballY, ballX, ballY, 2);
    let netV = Math.sqrt(velX * velX + velY * velY);
    let xV = Math.round(((netV + 18.0) * (velX + ballX) - 18.0 * ballX) / netV);
    let yV = Math.round(((netV + 18.0) * (-velY + ballY) - 18.0 * ballY) / netV);
    cxtF.fillText(firstAppearance ? "速度 v" : "v", xV || ballX, yV || ballY);
}

function drawGridF() {
    cxtF.fillStyle = "#A9F5BC";
    cxtF.fillRect(0, 0, widthF, heightF);

    cxtF.strokeStyle = "#A9A9F5";
    cxtF.lineWidth = 1;
    cxtF.beginPath();
    for (let i = 0; i <= widthF; i += 50) {
        cxtF.moveTo(i, 0); cxtF.lineTo(i, heightF);
    }
    for (let i = 0; i <= heightF; i += 50) {
        cxtF.moveTo(0, i); cxtF.lineTo(widthF, i);
    }
    cxtF.stroke();

    cxtF.strokeStyle = "red";
    cxtF.beginPath();
    cxtF.moveTo(widthFD2 - 10, heightFD2); cxtF.lineTo(widthFD2 + 10, heightFD2);
    cxtF.moveTo(widthFD2, heightFD2 - 10); cxtF.lineTo(widthFD2, heightFD2 + 10);
    cxtF.stroke();
}

function trace() {
    cxPat.beginPath();
    cxPat.arc(ballX, ballY, 2, 0, 2 * Math.PI);
    cxPat.fill();
}

function clearT() {
    cxPat.clearRect(0, 0, widthF, heightF);
    if (!myrequest) paintF();
}

function paintC() {
    drawGridC();
    drawBallC();
}

function drawBallC() {
    cxtC.beginPath();
    cxtC.fillStyle = "green";
    cxtC.arc(widthCD2, heightCD2, 12, 0, 2 * Math.PI);
    cxtC.fill();

    cxtC.fillStyle = showF ? "red" : "#F5BCA9";
    arrow(cxtC, arrowXC, arrowYC, widthCD2, heightCD2, 2);

    cxtC.fillStyle = "blue";
    arrow(cxtC, velX + widthCD2, -velY + heightCD2, widthCD2, heightCD2, 2);

    if (firstAppearance) {
        cxtC.fillStyle = "yellow";
        cxtC.fillText("拖動紅箭頭改變 F", widthCD2, heightCD2 + 100);
        cxtC.strokeStyle = "magenta";
        cxtC.beginPath();
        cxtC.setLineDash([4, 4]);
        cxtC.lineWidth = 3;
        cxtC.arc(arrowXC, arrowYC, 20, 0, 2 * Math.PI);
        cxtC.stroke();
        cxtC.setLineDash([0, 0]);
    }
}

function drawGridC() {
    cxtC.fillStyle = "#819FF7";
    cxtC.fillRect(0, 0, widthC, heightC);

    if (!firstAppearance) {
        cxtC.strokeStyle = "#D8D8D8";
        cxtC.beginPath();
        cxtC.moveTo(0, heightCD2); cxtC.lineTo(widthC, heightCD2);
        cxtC.moveTo(widthCD2, 0); cxtC.lineTo(widthCD2, heightC);
        cxtC.stroke();

        cxtC.beginPath();
        for (let r = 25; r <= 150; r += 25) {
            cxtC.arc(widthCD2, heightCD2, r, 0, 2 * Math.PI);
        }
        cxtC.stroke();
        locateCross();
    }
}

function locateCross() {
    let dist = Math.sqrt((ballX - widthFD2) ** 2 + (ballY - heightFD2) ** 2);
    if (dist > 350) {
        let crossX = -(120.0 / dist) * (ballX - widthFD2) + widthCD2;
        let crossY = -(120.0 / dist) * (ballY - heightFD2) + heightCD2;
        cxtC.strokeStyle = "red";
        cxtC.beginPath();
        cxtC.moveTo(crossX - 10, crossY); cxtC.lineTo(crossX + 10, crossY);
        cxtC.moveTo(crossX, crossY - 10); cxtC.lineTo(crossX, crossY + 10);
        cxtC.stroke();
    }
}

function arrow(g, dx1, dy1, dx2, dy2, width) {
    let d = Math.min(5.0, Math.max(1.0, 0.01 * width * Math.sqrt((dx1 - dx2) ** 2 + (dy1 - dy2) ** 2)));
    let d2 = d * 3;
    let theta = dy1 !== dy2 ? Math.atan((dx2 - dx1) / (dy1 - dy2)) : Math.PI / 2.0;
    if (theta < 0) theta = Math.PI + theta;
    let cos = Math.cos(theta), sin = Math.sin(theta);

    let a = (4.0 * dx1 + dx2) / 5.0;
    let b = (4.0 * dy1 + dy2) / 5.0;

    g.beginPath();
    g.moveTo(a + d * cos, b + d * sin);
    g.lineTo(a - d * cos, b - d * sin);
    g.lineTo(dx2 - d * cos, dy2 - d * sin);
    g.lineTo(dx2 + d * cos, dy2 + d * sin);

    g.moveTo(dx1, dy1);
    g.lineTo(a - d2 * cos, b - d2 * sin);
    g.lineTo(a + d2 * cos, b + d2 * sin);
    g.closePath();
    g.fill();
}

function getMousePointerCoord(evt) {
    let rect = canvasC.getBoundingClientRect();
    return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
    };
}

function mouseDown(evt) {
    let coord = getMousePointerCoord(evt);
    if (Math.hypot(coord.x - arrowXC, coord.y - arrowYC) < 25) {
        yesADrag = true;
        oldMX = coord.x; oldMY = coord.y;
        oldAX = arrowXC; oldAY = arrowYC;
    }
}

function mouseMove(evt) {
    let coord = getMousePointerCoord(evt);
    if (yesADrag) {
        firstAppearance = false;
        let vx = oldAX + coord.x - oldMX;
        let vy = oldAY + coord.y - oldMY;
        if (Math.hypot(vx - widthCD2, vy - heightCD2) < 150.0) {
            arrowXC = vx; arrowYC = vy;
            forceX = arrowXC - widthCD2;
            forceY = heightCD2 - arrowYC;
        }
        paintC();
        paintF();
    }
}

function mouseUp() {
    yesADrag = false;
}

function touchDown(evt) {
    let rect = canvasC.getBoundingClientRect();
    let touch = evt.touches[0];
    let tx = touch.clientX - rect.left;
    let ty = touch.clientY - rect.top;

    if (Math.hypot(tx - arrowXC, ty - arrowYC) < 30) {
        evt.preventDefault();
        yesADrag = true;
        oldMX = tx; oldMY = ty;
        oldAX = arrowXC; oldAY = arrowYC;
    }
}

function touchMove(evt) {
    if (yesADrag) {
        evt.preventDefault();
        let rect = canvasC.getBoundingClientRect();
        let touch = evt.touches[0];
        let tx = touch.clientX - rect.left;
        let ty = touch.clientY - rect.top;

        firstAppearance = false;
        let vx = oldAX + tx - oldMX;
        let vy = oldAY + ty - oldMY;
        if (Math.hypot(vx - widthCD2, vy - heightCD2) < 150.0) {
            arrowXC = vx; arrowYC = vy;
            forceX = arrowXC - widthCD2;
            forceY = heightCD2 - arrowYC;
        }
        paintC();
        paintF();
    }
}

function touchUp() {
    yesADrag = false;
}
</script>
</body>
</html>
