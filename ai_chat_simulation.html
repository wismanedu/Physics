### 🪙 實驗準備與操作步驟

* **準備材料：** 4 到 5 個厚重、大小相同的硬幣（極度推薦使用新台幣 50 元硬幣，因為它夠重、邊緣夠厚，效果最好）。一張非常平滑且堅固的桌面（如玻璃桌面或平滑的木桌）。

  2. 靜靜觀察。當這個旋轉硬幣因為摩擦力慢慢減速、開始劇烈搖晃（快要倒下）時……

### 🔬 為什麼會這樣？（反直覺的物理真相）

這個實驗看起來像魔法，但背後其實結合了三個高中的核心力學概念：

1. **剛體擺動（Nutational motion）與奇異點**
   當硬幣轉得很快時，它的自轉軸是垂直的。但隨著速度變慢，硬幣開始傾斜，這時它會一邊自轉，硬幣邊緣一邊在桌面上做快速的圓周滾動。
   在快要完全倒下的最後一秒，硬幣邊緣拍擊桌面的頻率會急劇飆高（這也是為什麼我們聽硬幣倒下時，最後會發出極其尖銳的「嗡嗡嗡啪」的聲音）。

2. **波動矩的衝擊（衝擊力矩）**
   當第一個硬幣在最後「啪」的一聲平貼桌面的那一剎那，它將累積的角動量瞬間轉化成一個強烈的垂直震動波，透過桌面傳遞出去。

3. **重心不對稱與能量共振**
   當這個震動波在桌面上傳導、碰到第二顆硬幣的邊緣時，因為衝擊力不是傳到硬幣的正中心，而是從邊緣網上拍擊，這會對第二顆硬幣的重心產生一個「不對稱的力矩」。加上所有硬幣大小、重量一模一樣，它們的固有頻率完美共振，這個力矩就像一隻無形的手，精準地把第二顆硬幣從邊緣「挑起來」，讓它再度轉動！

* **桌面材質：**
  * ❌ 不要選厚木桌或塑膠桌墊，因為它們會把震動波「吸收（阻尼）」掉。
  * ⭕ 選強化玻璃、大理石，或是很硬的辦公桌，震動波傳導效果最好。

                charIndex += step;
                if (charIndex >= fullLen) {
                    charIndex = fullLen;
                    clearInterval(timer);
                    container.classList.remove('cursor-blink');
                    container.innerHTML = marked.parse(text);
                    if (callback) callback();
                } else {
                    const currentChunk = text.substring(0, charIndex);
                    container.innerHTML = marked.parse(currentChunk);
                    scrollToBottom();
                }
            }, baseInterval);
        }

        // Auto Scroll to bottom smooth
        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function updateUIState() {
            // Update progress bar
            const total = dialogueData.length;
            const percentage = (currentIndex / total) * 100;
            progressBar.style.width = `${percentage}%`;
            progressText.innerText = `對話進度: ${currentIndex} / ${total}`;

            // Update status badge
            if (isTyping) {
                statusBadge.innerText = 'AI 正在輸入...';
                statusBadge.className = 'text-amber-400 animate-pulse';
            } else if (currentIndex >= total) {
                statusBadge.innerText = '模擬完成';
                statusBadge.className = 'text-blue-400';
            } else {
                statusBadge.innerText = isAutoPlay ? '自動播放中' : '等待操作';
                statusBadge.className = isAutoPlay ? 'text-emerald-400 animate-pulse' : 'text-slate-400';
            }

            // Button label & state
            if (currentIndex >= total) {
                btnNextText.innerText = '對話已結束 (點擊重播)';
                btnNext.disabled = false;
            } else if (isTyping) {
                btnNextText.innerText = '生成中...';
                btnNext.disabled = true;
            } else {
                btnNextText.innerText = `吐出下一段文字 (${currentIndex + 1}/${total})`;
                btnNext.disabled = false;
            }
        }

        function scheduleAutoPlay() {
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            const speed = parseFloat(speedSelect.value) || 1.5;
            const delay = Math.max(800, 2000 / speed);
            autoPlayTimer = setTimeout(() => {
                if (isAutoPlay && !isTyping && currentIndex < dialogueData.length) {
                    displayNextMessage();
                }
            }, delay);
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            if (isAutoPlay) {
                autoplayLabel.innerText = '自動播放: 開啟';
                autoplayIcon.className = 'fa-solid fa-circle-pause text-emerald-400';
                btnAutoplay.classList.add('border-emerald-500/50', 'bg-emerald-950/30');
                if (!isTyping && currentIndex < dialogueData.length) {
                    displayNextMessage();
                }
            } else {
                autoplayLabel.innerText = '自動播放: 關閉';
                autoplayIcon.className = 'fa-solid fa-circle-play text-blue-400';
                btnAutoplay.classList.remove('border-emerald-500/50', 'bg-emerald-950/30');
                if (autoPlayTimer) clearTimeout(autoPlayTimer);
            }
            updateUIState();
        }

        function restartConversation() {
            if (autoPlayTimer) clearTimeout(autoPlayTimer);
            currentIndex = 0;
            isTyping = false;
            isAutoPlay = false;
            autoplayLabel.innerText = '自動播放: 關閉';
            autoplayIcon.className = 'fa-solid fa-circle-play text-blue-400';
            btnAutoplay.classList.remove('border-emerald-500/50', 'bg-emerald-950/30');

            chatContainer.innerHTML = '';
            
            // Re-append initial welcome card
            const newWelcome = document.createElement('div');
            newWelcome.id = 'welcome-card';
            newWelcome.className = 'bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 text-center shadow-xl backdrop-blur my-8';
            newWelcome.innerHTML = `
                <div class="w-16 h-16 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-500/20">
                    <i class="fa-solid fa-comments text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">已重置對話紀錄</h2>
                <p class="text-slate-300 text-sm max-w-lg mx-auto mb-6 leading-relaxed">
                    點擊下方按鈕或按下 <kbd class="px-2 py-0.5 bg-slate-700 border border-slate-600 rounded text-xs font-mono text-blue-300">Space</kbd> / <kbd class="px-2 py-0.5 bg-slate-700 border border-slate-600 rounded text-xs font-mono text-blue-300">Enter</kbd> 鍵開始模擬。
                </p>
                <button id="btn-start" onclick="displayNextMessage()" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-200 inline-flex items-center gap-2">
                    <i class="fa-solid fa-play"></i>
                    重新開始模擬
                </button>
            `;
            chatContainer.appendChild(newWelcome);

            updateUIState();
        }

        // Main action trigger
        btnNext.addEventListener('click', () => {
            if (currentIndex >= dialogueData.length) {
                restartConversation();
            } else {
                displayNextMessage();
            }
        });

        if (btnStart) {
            btnStart.addEventListener('click', displayNextMessage);
        }

        btnRestart.addEventListener('click', restartConversation);
        btnAutoplay.addEventListener('click', toggleAutoPlay);

        // Modal triggers
        btnTranscript.addEventListener('click', () => {
            modalTranscript.classList.remove('opacity-0', 'pointer-events-none');
        });

        btnCloseModal.addEventListener('click', () => {
            modalTranscript.classList.add('opacity-0', 'pointer-events-none');
        });

        modalTranscript.addEventListener('click', (e) => {
            if (e.target === modalTranscript) {
                modalTranscript.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        // Keyboard navigation support
        document.addEventListener('keydown', (e) => {
            // Avoid triggering during modal view or input focus
            if (modalTranscript.classList.contains('opacity-0') === false) {
                if (e.key === 'Escape') {
                    modalTranscript.classList.add('opacity-0', 'pointer-events-none');
                }
                return;
            }

            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (!isTyping) {
                    if (currentIndex >= dialogueData.length) {
                        restartConversation();
                    } else {
                        displayNextMessage();
                    }
                }
            } else if (e.code === 'KeyR') {
                restartConversation();
            }
        });

        // Initialize script overview modal on page ready
        window.addEventListener('DOMContentLoaded', () => {
            buildTranscriptModal();
            updateUIState();
        });
    </script>
</body>
</html>
